<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胡拼亂湊💥</title>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 復古羊皮紙與紅墨水塗鴉風格 */
    body {
      background-color: #f4ecd8;
      font-family: 'Helvetica Neue', sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: #fffbfa;
      border: 3px solid #4a3b32;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 6px 6px 0px #4a3b32;
    }
    h1, h2, h3, h4 { text-align: center; color: #4a3b32; margin-top: 0; }
    
    .split-lobby { display: flex; gap: 20px; margin-bottom: 20px; }
    .lobby-card {
      flex: 1; padding: 20px; border: 2px dashed #4a3b32; border-radius: 8px;
      display: flex; flex-direction: column; gap: 10px; background: #faf4e6;
    }
    
    input { padding: 10px; border: 2px solid #4a3b32; border-radius: 6px; font-size: 16px; width: 90%; }
    
    button {
      padding: 10px 15px; background-color: #4a3b32; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;
      transition: all 0.2s;
    }
    button:active { transform: scale(0.95); }
    button:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }

    .btn-danger { background-color: #d32f2f; }
    .btn-success { background-color: #2e7d32; }
    .btn-warning { background-color: #f57c00; }
    .btn-secondary { background-color: #757575; }
    .btn-small { padding: 4px 8px; font-size: 12px; margin-left: 5px; }

    .red-ink-doodle {
      color: #d32f2f; font-family: 'Comic Sans MS', cursive; font-weight: bold;
      transform: rotate(-3deg); text-decoration: underline wavy #d32f2f; display: inline-block; margin-top: 10px;
    }

    .board-area, .hand-area {
      display: flex; gap: 10px; justify-content: center; margin: 20px 0; min-height: 80px; flex-wrap: wrap;
    }
    .slot {
      width: 60px; height: 80px; border: 2px dashed #4a3b32; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.05);
    }
    .card {
      width: 60px; height: 80px; background-color: #fff; border: 2px solid #4a3b32; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold;
      cursor: grab; box-shadow: 2px 2px 0px #4a3b32; user-select: none;
    }
    .card:active { cursor: grabbing; }
    
    .status-panel {
      background: #e9e2ce; padding: 15px; border-radius: 8px; border: 2px solid #4a3b32; margin-bottom: 20px;
    }
    .player-chip {
      background: rgba(255,255,255,0.7); padding: 5px 10px; border-radius: 20px; border: 1px solid #4a3b32;
      display: flex; align-items: center; gap: 5px;
    }
    .ready-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
    .ready-dot.on { background-color: #4caf50; }
    .ready-dot.off { background-color: #d32f2f; }
    
    .draw-initial-btn {
      padding: 20px 40px; font-size: 20px; background-color: #d84315; color: white;
      border-radius: 12px; border: 3px solid #bf360c; cursor: pointer; margin: 20px auto; display: block;
    }

    .appeal-box {
      background-color: #fff3e0; border: 2px dashed #f57c00; border-radius: 8px;
      padding: 15px; margin-top: 15px; text-align: center;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_NvqFklhilwIMOJ7dGIdAsuz1IGuCH_w",
      authDomain: "maybespellsomething.firebaseapp.com",
      databaseURL: "https://maybespellsomething-default-rtdb.firebaseio.com",
      projectId: "maybespellsomething",
      storageBucket: "maybespellsomething.firebasestorage.app",
      messagingSenderId: "872268418078",
      appId: "1:872268418078:web:8dd218aad0cd01914d720f",
      measurementId: "G-MG3KM8VEBR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const { useState, useEffect } = React;

    const getRandomLetter = () => {
      const letters = "AAAAEEEIIIOOOUUUBBCDDFFGGGHHJKLLMMNNPPRRSSTTVWXYZ";
      return letters[Math.floor(Math.random() * letters.length)];
    };

    const checkWordIsValid = async (word) => {
      if (!word) return false;
      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`);
        return res.ok;
      } catch (err) {
        console.error("字典API驗證錯誤", err);
        return false;
      }
    };

    function App() {
      const [nickname, setNickname] = useState("");
      
      const [createRoomId, setCreateRoomId] = useState("");
      const [deckSize, setDeckSize] = useState(80);
      const [targetScore, setTargetScore] = useState(30);
      
      const [joinRoomId, setJoinRoomId] = useState("");

      const [roomId, setRoomId] = useState("");
      const [inRoom, setInRoom] = useState(false);
      const [roomData, setRoomData] = useState(null);
      const [handCards, setHandCards] = useState([]);
      const [boardSlots, setBoardSlots] = useState([null, null, null, null, null, null, null, null]);
      
      const [errorMsg, setErrorMsg] = useState("");
      const [isVerifying, setIsVerifying] = useState(false); // 驗證狀態
      
      // 申訴系統狀態
      const [appealWord, setAppealWord] = useState("");
      const [appealUrl, setAppealUrl] = useState("");

      const backToLobby = () => {
        setInRoom(false);
        setRoomId("");
        setRoomData(null);
        setHandCards([]);
        setBoardSlots([null, null, null, null, null, null, null, null]);
        resetAppeal();
      };

      const resetAppeal = () => {
        setAppealWord("");
        setAppealUrl("");
        setErrorMsg("");
      };

      useEffect(() => {
        if (inRoom && roomId) {
          const roomRef = ref(db, `rooms/${roomId}`);
          const unsubscribe = onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
              alert("❌ 房間已被解散！");
              backToLobby();
              return;
            }
            if (!data.players || !data.players[nickname]) {
              alert("❌ 你已離開或被踢出房間！");
              backToLobby();
              return;
            }

            setRoomData(data);
            if (data.players[nickname]?.hand) {
              setHandCards(data.players[nickname].hand);
            } else {
              setHandCards([]);
            }
          });
          return () => unsubscribe();
        }
      }, [inRoom, roomId, nickname]);

      const handleCreateRoom = async () => {
        if (!nickname || !createRoomId) return alert("請輸入暱稱與欲建立的房號！");
        if (deckSize < 60) return alert("公牌數至少需要 60 張！");
        if (targetScore < 10) return alert("獲勝分數至少需要 10 分！");
        
        const roomRef = ref(db, `rooms/${createRoomId}`);
        const snapshot = await get(roomRef);
        
        if (snapshot.exists()) return alert("此房間號碼已被使用，請換一個！");

        const initialDeck = Array.from({ length: deckSize }, () => getRandomLetter());
        await set(roomRef, {
          host: nickname,
          status: "waiting",
          deckSize: parseInt(deckSize),
          targetScore: parseInt(targetScore),
          publicDeck: initialDeck,
          turnMultiplier: 1,
          players: {
            [nickname]: { score: 0, isReady: true, hand: [] }
          }
        });
        setRoomId(createRoomId);
        setInRoom(true);
      };

      const handleJoinRoom = async () => {
        if (!nickname || !joinRoomId) return alert("請輸入暱稱與房號！");
        
        const roomRef = ref(db, `rooms/${joinRoomId}`);
        const snapshot = await get(roomRef);
        
        if (!snapshot.exists()) return alert("找不到這個房間！");

        const currentData = snapshot.val();
        if (currentData.status !== "waiting") return alert("遊戲已經開始或結束，無法加入！");
        if (currentData.players && currentData.players[nickname]) return alert("此暱稱已在房間內，請換一個！");
        
        const playerCount = Object.keys(currentData.players || {}).length;
        if (playerCount >= 8) return alert("房間已滿 (最多 8 人)！");
        
        await update(ref(db, `rooms/${joinRoomId}/players/${nickname}`), {
          score: 0, isReady: false, hand: []
        });
        setRoomId(joinRoomId);
        setInRoom(true);
      };

      const toggleReady = async () => {
        const currentReady = roomData.players[nickname].isReady;
        await update(ref(db, `rooms/${roomId}/players/${nickname}`), {
          isReady: !currentReady
        });
      };

      const leaveRoom = async () => {
        if (!confirm("確定要退出房間嗎？")) return;
        if (roomData.host === nickname) {
          await remove(ref(db, `rooms/${roomId}`));
        } else {
          const updates = {};
          updates[`players/${nickname}`] = null;
          
          if (roomData.status === "playing" && roomData.turnOrder) {
            const newTurnOrder = roomData.turnOrder.filter(p => p !== nickname);
            updates["turnOrder"] = newTurnOrder;
            if (roomData.currentTurnPlayer === nickname && newTurnOrder.length > 0) {
              const currentIndex = roomData.turnOrder.indexOf(nickname);
              updates["currentTurnPlayer"] = newTurnOrder[currentIndex % newTurnOrder.length];
              updates["turnMultiplier"] = 1;
            }
          }
          await update(ref(db, `rooms/${roomId}`), updates);
        }
      };

      const kickPlayer = async (targetPlayer) => {
        if (!confirm(`確定要將【${targetPlayer}】踢出房間嗎？`)) return;
        const updates = {};
        updates[`players/${targetPlayer}`] = null;
        
        if (roomData.status === "playing" && roomData.turnOrder) {
          const newTurnOrder = roomData.turnOrder.filter(p => p !== targetPlayer);
          updates["turnOrder"] = newTurnOrder;
          if (roomData.currentTurnPlayer === targetPlayer && newTurnOrder.length > 0) {
            const currentIndex = roomData.turnOrder.indexOf(targetPlayer);
            updates["currentTurnPlayer"] = newTurnOrder[currentIndex % newTurnOrder.length];
            updates["turnMultiplier"] = 1;
          }
        }
        await update(ref(db, `rooms/${roomId}`), updates);
      };

      const disbandRoom = async () => {
        if (!confirm("⚠️ 確定要解散房間嗎？房間號將釋出。")) return;
        await remove(ref(db, `rooms/${roomId}`));
      };

      const startGame = async () => {
        const playerNames = Object.keys(roomData.players);
        const allReady = playerNames.every(p => roomData.players[p].isReady);
        
        if (playerNames.length < 2) return alert("至少需要 2 人才能開始遊戲！");
        if (!allReady) return alert("還有玩家尚未準備好！");

        await update(ref(db, `rooms/${roomId}`), { 
          status: "playing", 
          turnOrder: playerNames, 
          currentTurnPlayer: playerNames[0] 
        });
      };

      const drawInitialHand = async () => {
        const playerCount = Object.keys(roomData.players).length;
        let startingCardCount = 9;
        if (playerCount >= 4 && playerCount <= 6) startingCardCount = 8;
        if (playerCount >= 7) startingCardCount = 7;

        let currentDeck = [...roomData.publicDeck];
        const drawnCards = currentDeck.splice(0, startingCardCount);

        await update(ref(db, `rooms/${roomId}`), {
          [`players/${nickname}/hand`]: drawnCards,
          publicDeck: currentDeck
        });
      };

      const handleDragStart = (e, letter, sourceIndex, sourceType) => {
        e.dataTransfer.setData("letter", letter);
        e.dataTransfer.setData("sourceIndex", sourceIndex);
        e.dataTransfer.setData("sourceType", sourceType);
      };

      const handleDropToBoard = (e, targetIndex) => {
        e.preventDefault();
        resetAppeal(); // 移動卡牌時清除申訴狀態

        const letter = e.dataTransfer.getData("letter");
        const sourceIndex = parseInt(e.dataTransfer.getData("sourceIndex"));
        const sourceType = e.dataTransfer.getData("sourceType");

        if (boardSlots[targetIndex] !== null) return; 

        const newBoard = [...boardSlots];
        newBoard[targetIndex] = letter;

        if (sourceType === "hand") {
          const newHand = [...handCards];
          newHand.splice(sourceIndex, 1);
          update(ref(db, `rooms/${roomId}/players/${nickname}`), { hand: newHand });
        } else if (sourceType === "board") {
          newBoard[sourceIndex] = null;
        }
        
        setBoardSlots(newBoard);
      };

      const handleDragOver = (e) => e.preventDefault();

      const returnToHand = (index) => {
        resetAppeal(); // 移動卡牌時清除申訴狀態
        const letter = boardSlots[index];
        if (!letter) return;
        const newBoard = [...boardSlots];
        newBoard[index] = null;
        setBoardSlots(newBoard);
        
        const newHand = [...handCards, letter];
        update(ref(db, `rooms/${roomId}/players/${nickname}`), { hand: newHand });
      };

      // 獨立出得分成功邏輯 (讓 API 驗證跟申訴都能共用)
      const handleWordSuccess = async (word, isAppeal = false) => {
        const currentScore = roomData.players[nickname].score || 0;
        const multiplier = roomData.turnMultiplier || 1;
        const gainedScore = word.length + (multiplier - 1);
        const newScore = currentScore + gainedScore;
        
        if (newScore >= roomData.targetScore) {
          await update(ref(db, `rooms/${roomId}`), {
            [`players/${nickname}/score`]: newScore,
            status: "ended",
            winner: nickname
          });
          alert(`🎉 恭喜！你以 ${newScore} 分達成了獲勝目標！`);
        } else {
          await update(ref(db, `rooms/${roomId}`), {
            [`players/${nickname}/score`]: newScore,
            turnMultiplier: multiplier + 1
          });
          if (isAppeal) {
            alert(`✅ 申訴成功！已強制判定過關，獲得 ${gainedScore} 分。可以繼續出牌！`);
          } else {
            alert(`✅ 拼字成功！獲得 ${gainedScore} 分。可以繼續出牌！`);
          }
        }
        setBoardSlots([null, null, null, null, null, null, null, null]);
        resetAppeal();
      };

      const submitWord = async () => {
        const word = boardSlots.filter(s => s !== null).join("");
        if (word.length === 0) return setErrorMsg("拼字區是空的！");

        setIsVerifying(true);
        resetAppeal();

        try {
          // 1. 呼叫字典 API 驗證
          const isValid = await checkWordIsValid(word);
          
          // 2. 根據結果處理
          if (isValid) {
            await handleWordSuccess(word);
          } else {
            setErrorMsg(`系統找不到「${word}」！如果確定是真字，請使用下方申訴功能。`);
            setAppealWord(word); // 觸發申訴 UI
          }
        } catch (error) {
          // 3. 如果中間發生任何連線錯誤或資料庫錯誤，在這裡攔截
          console.error("送出單字時發生錯誤：", error);
          setErrorMsg("驗證或連線時發生錯誤，請再試一次！");
        } finally {
          // 4. 【最重要的一步】不管上面成功、失敗還是報錯，最後一定會解除按鈕鎖定！
          setIsVerifying(false);
        }
      };

        const isValid = await checkWordIsValid(word);
        
        if (isValid) {
          await handleWordSuccess(word);
        } else {
          setErrorMsg(`系統找不到「${word}」！如果確定是真字，請使用下方申訴功能。`);
          setAppealWord(word); // 觸發申訴 UI
        }
        
        setIsVerifying(false);
      };

      // 處理申訴送出
      const handleAppeal = () => {
        if (!appealUrl.includes("http")) {
          return alert("請輸入有效的辭典網址 (需包含 http)！");
        }
        handleWordSuccess(appealWord, true);
      };

      const drawAndSkip = async () => {
        resetAppeal();
        let currentDeck = roomData.publicDeck ? [...roomData.publicDeck] : [];
        let newHand = [...handCards];
        
        if (currentDeck.length > 0) {
          const drawnCard = currentDeck.shift();
          newHand.push(drawnCard);
        }

        const turnOrder = roomData.turnOrder || [];
        const currentIndex = turnOrder.indexOf(roomData.currentTurnPlayer);
        const nextPlayer = turnOrder[(currentIndex + 1) % turnOrder.length];

        const activeBoardCards = boardSlots.filter(s => s !== null);
        if (activeBoardCards.length > 0) {
           newHand = [...newHand, ...activeBoardCards];
           setBoardSlots([null, null, null, null, null, null, null, null]);
        }

        await update(ref(db, `rooms/${roomId}`), {
          [`players/${nickname}/hand`]: newHand,
          publicDeck: currentDeck,
          currentTurnPlayer: nextPlayer,
          turnMultiplier: 1
        });
      };

      if (!inRoom) {
        return (
          <div className="container">
            <h1>📜 線上連線拼字</h1>
            <div style={{ textAlign: 'center', marginBottom: '20px' }}>
              <input 
                placeholder="在此輸入你的遊戲暱稱" 
                value={nickname} 
                onChange={e => setNickname(e.target.value)} 
                style={{ width: '60%', textAlign: 'center' }}
              />
            </div>

            <div className="split-lobby">
              <div className="lobby-card">
                <h3>👑 創建新房間</h3>
                <label>自訂房號：</label>
                <input placeholder="例如: 8888" value={createRoomId} onChange={e => setCreateRoomId(e.target.value)} />
                <label>公牌總數量：</label>
                <input type="number" min="60" value={deckSize} onChange={e => setDeckSize(e.target.value)} />
                <label>獲勝目標分數：</label>
                <input type="number" min="10" value={targetScore} onChange={e => setTargetScore(e.target.value)} />
                <button onClick={handleCreateRoom} style={{ marginTop: '10px' }}>創立房間</button>
              </div>

              <div className="lobby-card">
                <h3>👥 加入房間</h3>
                <label>輸入房號：</label>
                <input placeholder="輸入好友給的房號" value={joinRoomId} onChange={e => setJoinRoomId(e.target.value)} />
                <p style={{ fontSize: '12px', color: '#666' }}>※ 房主解散房間後，原房號即可重複使用。</p>
                <button onClick={handleJoinRoom} className="btn-success" style={{ marginTop: 'auto' }}>加入遊戲</button>
              </div>
            </div>
          </div>
        );
      }

      const isHost = roomData?.host === nickname;
      const isMyTurn = roomData?.currentTurnPlayer === nickname;
      const myReadyStatus = roomData?.players[nickname]?.isReady;
      const hasDrawnInitial = handCards.length > 0;

      return (
        <div className="container">
          <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <h2>房號: {roomId} {isHost && "👑"}</h2>
              <p style={{ margin: '5px 0', fontWeight: 'bold' }}>獲勝目標：先達到 {roomData?.targetScore} 分者獲勝</p>
            </div>
            <div>
              {isHost ? (
                <button className="btn-danger" onClick={disbandRoom}>解散房間</button>
              ) : (
                <button className="btn-danger" onClick={leaveRoom}>退出房間</button>
              )}
            </div>
          </header>

          <div className="status-panel">
            <p><strong>狀態：</strong> {roomData?.status === "waiting" ? "等待玩家準備中..." : roomData?.status === "ended" ? "遊戲結束" : "遊戲進行中"}</p>
            {roomData?.status === "playing" && <p><strong>目前輪到：</strong> {roomData?.currentTurnPlayer}</p>}
            <p><strong>剩餘公牌：</strong> {roomData?.publicDeck?.length || 0} / {roomData?.deckSize} 張</p>
            <hr style={{ borderColor: "#4a3b32", opacity: 0.3 }} />
            
            <div style={{ display: 'flex', gap: '15px', flexWrap: 'wrap', alignItems: 'center' }}>
              {roomData?.players && Object.entries(roomData.players).map(([name, data]) => (
                <div key={name} className="player-chip">
                  <span className={`ready-dot ${data.isReady ? 'on' : 'off'}`}></span>
                  {name === roomData.host && "👑 "} {name} 
                  {roomData.status !== "waiting" && <span>: {data.score} 分</span>}
                  {name === roomData.currentTurnPlayer && roomData.status === "playing" ? " 🎯" : ""}
                  
                  {isHost && name !== nickname && (
                    <button className="btn-danger btn-small" onClick={() => kickPlayer(name)}>踢除</button>
                  )}
                </div>
              ))}
            </div>
          </div>

          {roomData?.status === "waiting" && (
            <div style={{ textAlign: 'center', marginTop: '20px' }}>
              {!isHost && (
                <button 
                  onClick={toggleReady} 
                  style={{ backgroundColor: myReadyStatus ? '#d32f2f' : '#2e7d32', marginRight: '10px' }}
                >
                  {myReadyStatus ? "取消準備" : "準備完成！"}
                </button>
              )}
              {isHost && (
                <button onClick={startGame}>全員準備完畢，開始遊戲！</button>
              )}
            </div>
          )}

          {roomData?.status === "ended" && (
            <div style={{ textAlign: 'center', padding: '40px' }}>
              <h1 style={{ color: '#d32f2f' }}>🎉 遊戲結束 🎉</h1>
              <h2>獲勝者：{roomData?.winner}</h2>
            </div>
          )}

          {roomData?.status === "playing" && !hasDrawnInitial && (
            <button className="draw-initial-btn" onClick={drawInitialHand}>
              🃏 抽取開局手牌
            </button>
          )}

          {roomData?.status === "playing" && hasDrawnInitial && (
            <>
              <h3>拼字區 (從手牌拖曳字母上來)</h3>
              <div className="board-area">
                {boardSlots.map((letter, index) => (
                  <div 
                    key={`slot-${index}`} 
                    className="slot"
                    onDragOver={handleDragOver}
                    onDrop={(e) => handleDropToBoard(e, index)}
                    onClick={() => returnToHand(index)}
                  >
                    {letter && (
                      <div 
                        className="card"
                        draggable={isMyTurn}
                        onDragStart={(e) => handleDragStart(e, letter, index, "board")}
                      >
                        {letter}
                      </div>
                    )}
                  </div>
                ))}
              </div>

              <div style={{ textAlign: 'center', minHeight: '40px' }}>
                {errorMsg && <div className="red-ink-doodle">{errorMsg}</div>}
              </div>

              {/* 申訴系統 UI */}
              {appealWord && (
                <div className="appeal-box">
                  <p style={{ margin: '0 0 10px 0', fontWeight: 'bold' }}>
                    真的有「{appealWord}」這個字嗎？請貼上線上辭典網址來申訴！
                  </p>
                  <input 
                    placeholder="例如: https://dictionary.cambridge.org/..." 
                    value={appealUrl} 
                    onChange={e => setAppealUrl(e.target.value)} 
                    style={{ width: '60%', marginBottom: '10px' }}
                  />
                  <br/>
                  <button className="btn-warning" onClick={handleAppeal}>送出申訴並強制過關</button>
                  <button className="btn-secondary" onClick={resetAppeal} style={{ marginLeft: '10px' }}>算了，我重拼</button>
                </div>
              )}

              <div style={{ textAlign: 'center', marginTop: '10px' }}>
                <button 
                  onClick={submitWord} 
                  disabled={!isMyTurn || isVerifying || appealWord !== ""} 
                  style={{ marginRight: '10px' }}
                >
                  {isVerifying ? "驗證中..." : "確認拼字"}
                </button>
                
                <button 
                  onClick={drawAndSkip} 
                  disabled={!isMyTurn || isVerifying} 
                  style={{ backgroundColor: '#8b4513' }}
                >
                  無法拼字，抽一張並跳過
                </button>
              </div>

              <h3>你的手牌</h3>
              <div className="hand-area">
                {handCards.map((letter, index) => (
                  <div 
                    key={`hand-${index}`} 
                    className="card"
                    draggable={isMyTurn}
                    onDragStart={(e) => handleDragStart(e, letter, index, "hand")}
                  >
                    {letter}
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
